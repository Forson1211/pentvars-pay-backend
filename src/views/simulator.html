<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PentVars Pay - USSD Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --success: #10b981;
            --error:   #ef4444;
            --accent:  #ff9b01;
            --primary: #433568;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body { width: 100%; min-height: 100vh; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(ellipse at 30% 0%, #1a1040 0%, #0c0c14 60%, #060609 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px 20px;
            min-height: 100vh;
        }

        /* ═══════════════════════════════════════════
           iPhone 17 Pro Max — Titanium frame
        ═══════════════════════════════════════════ */
        .phone-wrapper {
            position: relative;
            width: min(370px, 92vw);
            aspect-ratio: 9 / 18.0; /* Increased height slightly */
            border-radius: 40px;
            /* Titanium brushed-metal border - ultra thin! */
            background:
                linear-gradient(160deg,
                    #c8caca 0%, #8a8f93 18%,
                    #bec2c4 35%, #6e7377 52%,
                    #a8aeB0 68%, #9ba0a3 84%,
                    #c0c4c6 100%);
            padding: 4px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.22) inset,
                0 0 0 1px rgba(0,0,0,0.6),
                0 30px 60px -10px rgba(0,0,0,0.85),
                0 0 80px rgba(67,53,104,0.3);
            flex-shrink: 0;
        }

        /* Inner black glass */
        .phone-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 36px;
            background: #101012;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Dynamic Island ── */
        .dynamic-island {
            position: absolute;
            top: clamp(9px, 2.5vw, 13px);
            left: 50%;
            transform: translateX(-50%);
            width: clamp(100px, 27vw, 118px);
            height: clamp(28px, 7.5vw, 34px);
            background: #000;
            border-radius: 50px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 0 0 1.5px rgba(255,255,255,0.06);
        }

        .di-camera {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #0a0a0a;
            border: 1.5px solid #1c1c1e;
        }

        .di-sensor {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #1a1820;
        }

        /* ── Phone screen ── */
        .phone-screen {
            position: relative;
            flex: 1;
            background: #16161a;
            padding: clamp(36px, 8vw, 46px) clamp(12px, 3vw, 16px) clamp(8px, 2vw, 12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: inherit;
        }

        /* ── Status Bar — iOS 18 style ── */
        .status-bar {
            position: absolute;
            top: clamp(8px, 2vw, 12px);
            left: clamp(14px, 4vw, 20px);
            right: clamp(14px, 4vw, 20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .status-time {
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 700;
            color: #fff;
            font-family: -apple-system, 'SF Pro Display', 'Outfit', sans-serif;
            letter-spacing: -0.2px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 6px);
        }

        .status-icons svg {
            width: clamp(12px, 3vw, 14px);
            height: clamp(12px, 3vw, 14px);
        }

        /* ── Dialer ── */
        .dialer-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: clamp(10px, 3vh, 18px);
            padding-top: clamp(8px, 2vw, 16px);
        }

        .number-display {
            text-align: center;
            font-size: clamp(1.5rem, 7vw, 2.2rem);
            font-weight: 600;
            height: clamp(52px, 14vw, 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            letter-spacing: 2px;
            overflow: hidden;
            white-space: nowrap;
        }

        .dialpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 3vw, 18px) clamp(8px, 2.5vw, 16px);
            padding: 0 clamp(4px, 1vw, 8px);
            justify-items: center;
        }

        .dial-btn {
            width:  clamp(52px, 14vw, 68px);
            height: clamp(52px, 14vw, 68px);
            border-radius: 50%;
            background: #25262c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dial-btn:active { transform: scale(0.91); background: #3a3b44; }

        .dial-num  { font-size: clamp(1.2rem, 4vw, 1.6rem); font-weight: 600; }
        .dial-alph { font-size: clamp(0.52rem, 1.4vw, 0.65rem); color: #888; text-transform: uppercase; margin-top: -2px; }

        .dialer-footer {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: clamp(8px, 2vw, 16px) 0 clamp(4px, 1vw, 8px);
        }

        .call-btn {
            width:  clamp(52px, 14vw, 64px);
            height: clamp(52px, 14vw, 64px);
            border-radius: 50%;
            background: var(--success);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16,185,129,0.45);
            border: none;
            outline: none;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .call-btn:active { transform: scale(0.9); }

        .backspace-btn {
            background: transparent;
            border: none;
            color: #777;
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            cursor: pointer;
            width: clamp(40px, 11vw, 52px);
            height: clamp(40px, 11vw, 52px);
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .backspace-btn:active { color: #fff; }

        /* ── Home indicator ── */
        .home-indicator {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: clamp(4px, 1vw, 8px);
        }

        .home-bar {
            width: clamp(100px, 28vw, 130px);
            height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
        }

        /* ── USSD Dialog overlay ── */
        .ussd-dialog-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.72);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: clamp(12px, 3vw, 20px);
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            border-radius: inherit;
        }

        .ussd-dialog-overlay.active { opacity: 1; }

        .ussd-card {
            background: #fff;
            color: #111;
            width: 100%;
            border-radius: 14px;
            padding: clamp(14px, 4vw, 20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.55);
            display: flex;
            flex-direction: column;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
        }

        .ussd-dialog-overlay.active .ussd-card { transform: translateY(0); }

        .ussd-message {
            font-family: monospace;
            font-size: clamp(0.82rem, 2.2vw, 0.95rem);
            line-height: 1.55;
            white-space: pre-wrap;
            margin-bottom: 14px;
            color: #222;
        }

        .ussd-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 1rem;
            outline: none;
        }

        .ussd-input:focus { border-color: var(--primary); }

        .ussd-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
        }

        .ussd-btn {
            background: transparent;
            border: none;
            color: #007aff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
        }

        .ussd-btn:active { opacity: 0.6; }

        /* ── SIM label under phone ── */
        .sim-label {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(25, 26, 38, 0.82);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            padding: 10px 18px;
            width: min(340px, 90vw);
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .sim-label label {
            font-size: 0.83rem;
            color: #9ca3af;
            white-space: nowrap;
            font-weight: 500;
        }

        .sim-label input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f3f4f6;
            font-family: 'Fira Code', monospace;
            min-width: 0;
        }

        /* ── Hidden panels (kept for JS) ── */
        .info-panel, .debugger-panel { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    </style>
</head>
<body>

<!-- ── Hidden Info Panel (JS refs) ── -->
<div class="info-panel" aria-hidden="true">
    <h1>PentVars Pay</h1>
    <div>
        <label for="sim-phone">SIM Phone Number:</label>
        <input type="text" id="sim-phone" value="0244123456">
    </div>
</div>

<!-- ═══════════════════════════════════════
     iPhone 17 Pro Max
═══════════════════════════════════════ -->
<div class="phone-wrapper">
  <div class="phone-inner">

    <!-- Dynamic Island -->
    <div class="dynamic-island">
        <div class="di-sensor"></div>
        <div class="di-camera"></div>
    </div>

    <div class="phone-screen">

        <!-- ── iOS Status Bar ── -->
        <div class="status-bar">
            <!-- Time -->
            <span class="status-time" id="phone-time">9:41</span>

            <!-- Right side icons: Signal · WiFi · Battery -->
            <div class="status-icons">
                <!-- Cellular Signal (4 bars filled) -->
                <svg viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Signal">
                    <rect x="0"  y="8"  width="3" height="4"  rx="0.8" fill="white"/>
                    <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.8" fill="white"/>
                    <rect x="9"  y="3"  width="3" height="9"  rx="0.8" fill="white"/>
                    <rect x="13.5" y="0" width="3" height="12" rx="0.8" fill="white"/>
                </svg>

                <!-- Wi-Fi -->
                <svg viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="WiFi">
                    <!-- Outer arc -->
                    <path d="M1 4.3 C3.7 1.4 8 0 8 0 C8 0 12.3 1.4 15 4.3" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                    <!-- Middle arc -->
                    <path d="M3.2 6.7 C4.8 4.9 8 3.8 8 3.8 C8 3.8 11.2 4.9 12.8 6.7" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                    <!-- Inner arc -->
                    <path d="M5.6 9.1 C6.3 8.1 8 7.4 8 7.4 C8 7.4 9.7 8.1 10.4 9.1" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                    <!-- Dot -->
                    <circle cx="8" cy="11.4" r="1.2" fill="white"/>
                </svg>

                <!-- Battery -->
                <svg viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Battery">
                    <!-- Shell -->
                    <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-opacity="0.35" stroke-width="1"/>
                    <!-- Fill (green ~80%) -->
                    <rect x="2" y="2" width="16" height="8" rx="1.5" fill="#30D158"/>
                    <!-- Terminal nub -->
                    <path d="M22.5 4.2 C23.5 4.2 24 4.8 24 6 C24 7.2 23.5 7.8 22.5 7.8 Z" fill="white" fill-opacity="0.4"/>
                </svg>
            </div>
        </div>

        <!-- ── Dialer ── -->
        <div class="dialer-screen" id="dialer-ui">
            <div class="number-display" id="number-input"></div>

            <div class="dialpad-grid">
                <button class="dial-btn" data-key="1"><span class="dial-num">1</span><span class="dial-alph">o_o</span></button>
                <button class="dial-btn" data-key="2"><span class="dial-num">2</span><span class="dial-alph">abc</span></button>
                <button class="dial-btn" data-key="3"><span class="dial-num">3</span><span class="dial-alph">def</span></button>

                <button class="dial-btn" data-key="4"><span class="dial-num">4</span><span class="dial-alph">ghi</span></button>
                <button class="dial-btn" data-key="5"><span class="dial-num">5</span><span class="dial-alph">jkl</span></button>
                <button class="dial-btn" data-key="6"><span class="dial-num">6</span><span class="dial-alph">mno</span></button>

                <button class="dial-btn" data-key="7"><span class="dial-num">7</span><span class="dial-alph">pqrs</span></button>
                <button class="dial-btn" data-key="8"><span class="dial-num">8</span><span class="dial-alph">tuv</span></button>
                <button class="dial-btn" data-key="9"><span class="dial-num">9</span><span class="dial-alph">wxyz</span></button>

                <button class="dial-btn" data-key="*"><span class="dial-num">*</span><span class="dial-alph"></span></button>
                <button class="dial-btn" data-key="0"><span class="dial-num">0</span><span class="dial-alph">+</span></button>
                <button class="dial-btn" data-key="#"><span class="dial-num">#</span><span class="dial-alph"></span></button>
            </div>

            <div class="dialer-footer">
                <div style="width:clamp(40px,11vw,52px);"></div>
                <button class="call-btn" id="call-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </button>
                <button class="backspace-btn" id="backspace-btn">⌫</button>
            </div>
        </div>

        <!-- USSD dialog -->
        <div class="ussd-dialog-overlay" id="ussd-dialog">
            <div class="ussd-card">
                <div class="ussd-message" id="ussd-message">Sending request...</div>
                <input type="text" class="ussd-input" id="ussd-input" placeholder="" autocomplete="off">
                <div class="ussd-buttons" id="ussd-dialog-buttons">
                    <button class="ussd-btn" id="cancel-btn" style="color:#666;">Cancel</button>
                    <button class="ussd-btn" id="send-btn">Send</button>
                </div>
            </div>
        </div>

        <!-- Home indicator -->
        <div class="home-indicator"><div class="home-bar"></div></div>
    </div>
  </div>
</div>

<!-- SIM Number input below phone -->
<div class="sim-label">
    <label for="sim-phone-visible">📱 SIM Number:</label>
    <input type="tel" id="sim-phone-visible" value="0244123456" placeholder="0244123456" maxlength="13"
           oninput="document.getElementById('sim-phone').value = this.value">
    <input type="hidden" id="sim-phone" value="0244123456">
</div>

<!-- Hidden debugger panel (JS refs) -->
<div class="debugger-panel" aria-hidden="true">
    <div class="debugger-title">
        <span>Terminal Logs</span>
        <button id="clear-logs-btn">Clear</button>
    </div>
    <div id="logs-container">
        <div class="log-entry">
            <div class="log-time">Simulator ready</div>
            <div class="log-content">Waiting for dial-in session...</div>
        </div>
    </div>
</div>

<script src="/api/ussd/simulator.js"></script>
<script>
    // Live clock
    function updateClock() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        document.getElementById('phone-time').textContent =
            h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Keep hidden sim-phone in sync with visible input
    const vis = document.getElementById('sim-phone-visible');
    const hid = document.getElementById('sim-phone');
    if (vis && hid) {
        vis.addEventListener('input', () => hid.value = vis.value);
    }
</script>
</body>
</html>
